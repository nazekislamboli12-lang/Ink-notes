<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ink Notes</title>
<meta name="theme-color" content="#2b6fd6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="file-gallery" accept="image/*" hidden>
<input type="file" id="file-import" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="file-backup" accept="application/json,.json" hidden>
<script src="vendor/pdf-lib.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
